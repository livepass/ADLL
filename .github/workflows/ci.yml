name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # requirements.lock 固定的是 py3.12 win_amd64 wheel 的 SHA-256
    # （例如 MarkupSafe 3.0.4 = markupsafe-3.0.4-cp312-cp312-win_amd64.whl），
    # 在 Linux 上 --require-hashes 必然失败。受限 worker 的 DACL/Job Object
    # 证据也只在 Windows 上可执行，因此后端固定用 windows-latest。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Migrate from zero
        env:
          ADLL_DATABASE_URL: sqlite:///./ci.db
        run: python -m alembic upgrade head
      - name: Compile check
        run: python -m compileall -q app
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
